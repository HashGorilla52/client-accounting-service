server:
  port: 8081

spring:
  application:
    name: client-accounting-service
  datasource:
    url: jdbc:postgresql://localhost:5432/client_accounts
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

logging:
  level:
    com.lde.clientaccountingservice: DEBUG



