services:
  postgres-client-accounts:
    image: postgres:15
    environment:
      POSTGRES_DB: client_accounts_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d client_accounts_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  client-accounting-service:
    build: ./
    container_name: client-accounting-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-client-accounts:5432/client_accounts_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-client-accounts:
        condition: service_healthy


